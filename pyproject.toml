[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dupe-cleaner"
version = "0.1.0"
description = "Local-first duplicate finder (incl. inside archives) with a safe quarantine workflow, and a roadmap toward media-aware near-duplicate detection, face recognition and auto-albums."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aziz Imomnazarov" }]

dependencies = [
    "py7zr>=0.21",
    "rarfile>=4.1",
    "xxhash>=3.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Phase 2 (near-duplicate media + face recognition) — intentionally NOT
# installed by default: heavy native deps (dlib/onnxruntime). See
# docs/ROADMAP.md and src/dupecleaner/media.py.
media = ["imagehash>=4.3", "videohash>=3.0.0", "face_recognition>=1.3"]

[project.scripts]
dupecleaner = "dupecleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
