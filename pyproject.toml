[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dupe-cleaner"
version = "0.1.0"
description = "Local-first duplicate finder (incl. inside archives) with a safe quarantine workflow, and a roadmap toward media-aware near-duplicate detection, face recognition and auto-albums."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aziz Imomnazarov" }]

dependencies = [
    "py7zr>=0.21",
    "rarfile>=4.1",
    "xxhash>=3.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
# Phase 3 (near-duplicate media) — still a placeholder, see
# docs/ROADMAP.md and src/dupecleaner/media.py.
media = ["imagehash>=4.3", "videohash>=3.0.0"]
# Phase 4, task 18: offline face detection + embeddings. Separate from
# [media] and not installed by default because it is the heaviest thing
# this project asks for — 43.8 MB of wheel and 117.6 MB on disk for
# OpenCV on Windows, plus numpy, plus 37.1 MB of ONNX weights that
# `dupecleaner faces --install-models` fetches once. Everything runs
# locally afterwards; see src/dupecleaner/faces.py for why this engine
# and not dlib or InsightFace.
faces = ["opencv-python-headless>=4.9", "numpy>=1.24"]

[project.scripts]
dupecleaner = "dupecleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
